[package]
name = "osv-mcp"
version = "1.2.0"
edition = "2024"
authors = ["Leandro Vizzio <leandro@vizzio.xyz>"]
description = "MCP server for CVE and security advisory lookup via OSV.dev"
license = "Apache-2.0"
repository = "https://github.com/JLFN/osv-mcp"
homepage = "https://github.com/JLFN/osv-mcp"
keywords = ["mcp", "security", "cve", "advisory", "vulnerability"]
categories = ["development-tools", "security"]
readme = "README.md"

[dependencies]
adk-mcp-sdk = "0.1"
rmcp = { version = "1.7", features = ["server", "transport-io", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
