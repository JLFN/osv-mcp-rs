[package]
name = "osv-mcp"
version = "1.4.0"
edition = "2021"
rust-version = "1.88"
description = "MCP server for CVE and security advisory lookup via OSV.dev"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/JLFN/osv-mcp-rs"
homepage = "https://github.com/JLFN/osv-mcp-rs"
documentation = "https://docs.rs/osv-mcp"
keywords = ["mcp", "security", "cve", "advisory", "vulnerability"]
categories = ["development-tools", "security"]

# Keep the published .crate lean and rule-14-clean: exclude the embedded
# build tooling (which contains a Python helper) and the machine-local
# AGENTS.md (absolute /data paths) from the package.
exclude = [
  "build/",
  "AGENTS.md",
]

# Standalone crate; /data is a multi-project layout, not a cargo workspace.
[workspace]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
quick-xml = "0.41.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.1.0", features = ["transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"

[profile.release]
strip = true
lto = true
